# Install once per clone:  uv run pre-commit install
# Run against everything:  uv run pre-commit run --all-files
repos:
  # Keep `rev` equal to the ruff version in the project venv (pyproject's dev
  # group, see `uv run ruff --version`). This hook fetches its own copy of ruff,
  # so the two drift independently — and a formatter that disagrees with the
  # local one is worse than no hook: each run reverts the other's output, and
  # the check stops being the check you think it is. v0.8.6 vs the venv's
  # 0.16.3 disagreed on assert-message wrapping and cost two rejected commits.
  # Bump both together, never one alone.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # System gitleaks (8.28) instead of the upstream hook: the upstream one
      # builds from source and needs a Go toolchain we do not have.
      - id: gitleaks
        name: gitleaks (scan staged changes for secrets)
        entry: gitleaks git --staged --no-banner --redact --verbose
        language: system
        pass_filenames: false

      # Runs inside the project venv so it sees the same dependencies as the app.
      - id: mypy
        name: mypy (app/)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
