[project]
name = "rag-reliability-system"
version = "0.1.0"
description = "A RAG pipeline that scores its own groundedness, blocks prompt injection, and refuses to answer unsupported claims."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "httpx>=0.28.1",
    # Reranker (app/services/reranking.py), and numpy for the vector store.
    # All three once arrived as transitive deps of chromadb and were declared
    # here anyway, because a core component must not rely on another package's
    # dependency graph continuing to include it. chromadb was dropped in
    # chunk 7.2 when exact search replaced the HNSW arm; these three kept
    # resolving, which is exactly what that reasoning was insuring against.
    #
    # onnxruntime is pinned exactly, not floated. reranking.py's negative
    # control asserts a property of ORT's *dynamic quantization* — that batch
    # composition perturbs activation scales — and a runtime upgrade could
    # change that behaviour, failing the assertion for reasons unrelated to
    # this code. Bump deliberately, then re-run `python -m app.services.reranking`.
    "onnxruntime==1.29.0",
    "tokenizers>=0.20",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    # Pinned exactly, not floated -- scripts/validate_token_counter.py measures
    # a property (never-under-count margin) against this exact tokenizer
    # version's cl100k_base output; a silent minor-version bump could change
    # BPE merges and invalidate a recorded margin without anyone noticing.
    # Declared only -- not installed. `uv add tiktoken==0.8.0` (Phase B, after
    # approval) resolves and locks it; confirm 0.8.0 is still current on PyPI
    # at that point and bump deliberately if not.
    "tiktoken==0.8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.uv]
# This is an application, not a distributable library: nothing to build or install.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# `app` alone was a partial surface, and the gate was green because of what it
# did not look at: scripts/ produces the committed measurement artifacts
# (docs/chunk5-results.json, docs/chunk7-scores.json) and the gate that guards
# them, and it went unchecked from the day this config was written. Widening it
# cost one real fix (chunk5_benchmark.py, an invariant dict key). tests/ is in
# for the same reason — test_vector_search_stability.py is a regression guard,
# not scratch.
files = ["app", "scripts", "tests"]

# scripts/ is a namespace package (no __init__.py) run as `python -m
# scripts.<name>`. Without this, mypy resolves the same file under two module
# names and refuses to check anything at all.
explicit_package_bases = true
mypy_path = "."

# onnxruntime ships no py.typed marker. Scoped to that one module so `strict`
# still covers everything else — reranking.py's own signatures stay checked,
# only the third-party import is untyped.
[[tool.mypy.overrides]]
module = ["onnxruntime.*"]
ignore_missing_imports = true
